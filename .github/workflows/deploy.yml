name: Deploy Vite app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find app directory
        id: find
        run: |
          DIR=$(dirname "$(find . -name package.json | head -n 1)")
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "App directory: $DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install
        working-directory: ${{ steps.find.outputs.dir }}

      - name: Build
        run: npm run build
        working-directory: ${{ steps.find.outputs.dir }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      
